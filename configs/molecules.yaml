# ---- tuning molecules (parameter choices only; never in evaluation tables) ----
HF:
  charge: 0
  multiplicity: 1
  geometry: [[F, 0.0, 0.0, 0.0], [H, 0.0, 0.0, 0.9168]]
  source: "NIST CCCBDB experimental geometry (casno 7664393); r_e from Le Roy (1999), J. Mol. Spectrosc. 194, 189"

BH3:
  charge: 0
  multiplicity: 1
  geometry: [[B, 0.0, 0.0, 0.0], [H, 0.0, 1.1900, 0.0], [H, 1.0306, -0.5950, 0.0], [H, -1.0306, -0.5950, 0.0]]
  source: "NIST CCCBDB experimental geometry (casno 13283313); r_0 from Kuchitsu (1998)"

# ---- exact-optimum set: species without an experimental geometry in CCCBDB ----
# CCCBDB lists HeH+ (casno 9000219) and H3+ but gives no experimental coordinates for either.
# Their bond lengths are computed equilibrium values (scripts/ion_geometries.py: FCI/cc-pVTZ
# scan, exact for two electrons within the basis) and are written below by that script.
HeH+:
  charge: 1
  multiplicity: 1
  geometry: [[He, 0.0, 0.0, 0.0], [H, 0.0, 0.0, 0.7756]]
  source: "computed equilibrium bond length 0.7756 A (FCI/cc-pVTZ scan, scripts/ion_geometries.py); no experimental geometry in CCCBDB"

H3+:
  charge: 1
  multiplicity: 1
  geometry: [[H, 0.0000, 0.0000, 0.0000], [H, 0.8746, 0.0000, 0.0000], [H, 0.4373, 0.7574, 0.0000]]
  source: "computed equilibrium side length 0.8746 A of the equilateral triangle (FCI/cc-pVTZ scan, scripts/ion_geometries.py); no experimental geometry in CCCBDB"

# A linear H4 chain has no equilibrium structure (it dissociates into two H2 molecules).
# It is a standard model system; the uniform spacing below is a stated convention.
H4chain:
  charge: 0
  multiplicity: 1
  geometry: [[H, 0.0, 0.0, 0.0], [H, 0.0, 0.0, 1.0], [H, 0.0, 0.0, 2.0], [H, 0.0, 0.0, 3.0]]
  source: "model geometry: linear chain with uniform 1.0 Angstrom spacing (convention; no experimental structure exists)"
